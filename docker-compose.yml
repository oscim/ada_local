services:
  ada:
    build:
      context: .
      dockerfile: Dockerfile
    image: ada-local-web:latest
    container_name: ada-local-web
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${ADA_PUBLISHED_WEB_PORT:-7654}:${ADA_WEB_PORT:-7654}"
    volumes:
      # Recommandé : données persistantes hors conteneur.
      # Le conteneur sait fonctionner sans ces volumes, mais les données seraient jetables.
      - ./data:/app/data
      - ./skills:/app/skills
      - ./documents:/app/documents
      - ./rag:/app/rag
      - ./models:/app/models
      - ./web/certs:/app/web/certs
      - ada-cache:/app/.cache
    extra_hosts:
      # Utile sous Linux si Ollama ou n8n tournent sur la machine hôte.
      - "host.docker.internal:host-gateway"

volumes:
  ada-cache:
