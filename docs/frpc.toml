# ============================================================
#  frp - Client (à installer sur la machine Ada, chez toi)
# ============================================================

serverAddr = "TON_VPS_IP_OU_DOMAINE"   # ex: 51.12.34.56 ou vps.mondomaine.com
serverPort = 7000

# Même token que dans frps.toml
auth.method = "token"
auth.token  = "CHANGE_MOI_SECRET_FORT"

# Logs
log.to    = "/var/log/frpc.log"
log.level = "info"

# ----------------------------------------------------------
#  Tunnel principal — Interface web d'Ada
# ----------------------------------------------------------
[[proxies]]
name       = "ada-web"
type       = "tcp"
localIP    = "127.0.0.1"
localPort  = 8000          # ← port local d'Ada (adapter si besoin)
remotePort = 6000          # ← port exposé sur le VPS
# Accès depuis l'extérieur : http://TON_VPS:6000

